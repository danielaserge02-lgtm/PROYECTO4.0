<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Times New Roman", serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#52c6f4;
}

.telefono{
width:330px;
height:700px;
background:#c8e9f8;
border-radius:30px;
position:relative;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.telefono::before{
content:"";
position:absolute;
width:450px;
height:450px;
border:4px solid white;
border-radius:50%;
left:-270px;
top:-50px;
}

.telefono::after{
content:"";
position:absolute;
width:480px;
height:480px;
border:4px solid white;
border-radius:50%;
right:-300px;
bottom:-180px;
}

.onda1{
position:absolute;
width:380px;
height:380px;
border:4px solid #2cb5e8;
border-radius:50%;
left:-260px;
top:170px;
}

.onda2{
position:absolute;
width:360px;
height:360px;
border:4px solid #2cb5e8;
border-radius:50%;
right:-240px;
top:-40px;
}

.contenido{
position:relative;
z-index:2;
padding:25px;
}

h1{
text-align:center;
font-size:36px;
margin-top:20px;
margin-bottom:35px;
}

label{
display:block;
margin-bottom:5px;
margin-top:12px;
font-size:16px;
}

input{
width:100%;
padding:10px;
border:none;
border-radius:15px;
background:#d9d9d9;
font-size:15px;
outline:none;
}

button{
width:100%;
padding:12px;
margin-top:30px;
border:none;
background:#d9d9d9;
font-size:20px;
cursor:pointer;
border-radius:5px;
transition:.3s;
}

button:hover{
background:#bdbdbd;
}

.enlace{
text-align:center;
margin-top:20px;
}

.enlace a{
text-decoration:none;
color:black;
}

.enlace a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="telefono">

<div class="onda1"></div>
<div class="onda2"></div>

<div class="contenido">

<h1>REGISTRAR</h1>

<form action="index.html">

<label>Nombre Completo</label>

<input
type="text"
name="nombre"
placeholder="Ingrese su nombre"
required>

<label>Correo Electronico</label>

<input
type="email"
name="correo"
placeholder="Ingrese su correo"
required>

<label>Fecha de Nacimiento</label>

<input
type="date"
name="fecha"
required>

<label>Contraseña</label>

<input
type="password"
name="contrasena"
placeholder="Ingrese una contraseña"
required>

<label>Confirmar Contraseña</label>

<input
type="password"
name="confirmar"
placeholder="Repita la contraseña"
required>

<button type="submit">
REGISTRAR
</button>

</form>

<div class="enlace">

<a href="index.html">

</a>

</div>

</div>

</div>

</body>

</html>
